name: Hourly Twitter Sync
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Sync Endpoint
        run: |
          # Use VERCEL_URL if provided, otherwise you can hardcode your site URL here
          URL="${{ secrets.VERCEL_PROJECT_URL }}"
          if [ -z "$URL" ]; then
            echo "Error: VERCEL_PROJECT_URL secret is not set."
            exit 1
          fi
          
          curl -s -X GET "https://$URL/api/sync" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
