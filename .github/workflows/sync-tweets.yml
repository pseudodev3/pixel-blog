name: Hourly Twitter Sync
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Sync Endpoint
        run: |
          # Clean the URL (remove https:// if user added it)
          URL=$(echo "${{ secrets.VERCEL_PROJECT_URL }}" | sed -e 's|^https://||' -e 's|/$||')
          
          if [ -z "$URL" ]; then
            echo "::error::VERCEL_PROJECT_URL secret is empty!"
            exit 1
          fi
          
          echo "Connecting to node: $URL"
          
          RESPONSE=$(curl -s -w "%{http_code}" -o response.txt -X GET "https://$URL/api/sync" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          echo "HTTP_STATUS: $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "SUCCESS: Sync completed."
            cat response.txt
          else
            echo "::error::Sync failed with status $RESPONSE"
            cat response.txt
            exit 1
          fi
